  # Qwen3.8-27B (Unsloth UD-Q8_K_XL, ~29GB) - dense hybrid Gated DeltaNet + Gated Attention with MTP
  # Runs on llama-server (requires llama.cpp >= b10360 for the qwen3.8 arch).
  # Samplers: Unsloth thinking-mode recommendation (temp 1.0, top-p 0.95, top-k 20, min-p 0, rep-pen 1.0)
  # Template defaults reasoning_effort to xhigh - overridden to medium (xhigh wastes tokens);
  # --reasoning-budget 4096 hard-caps runaway thinking; --reasoning-preserve keeps prior-turn
  # reasoning in history (avoids KV/DeltaNet-state invalidation, same issue as qwen3.6);
  # --spec-type draft-mtp enables self-speculative decoding via the model's MTP layer
  # mmproj: vision projector from the same unsloth repo (ollama hf.co pull skips it,
  # so it lives in the project mmproj/ dir; download via mmproj/README.md)
  qwen3.8-27b-gguf-27.3b-ud-q8_k_xl:
    jinja: true
    mmproj: /Users/au/src/model_serve/mmproj/Qwen3.8-27B-mmproj-F16.gguf
    chat_template_kwargs: '{"reasoning_effort": "medium"}'
    sampler_args: --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --repeat-penalty 1.0 --reasoning-budget 4096 --reasoning-budget-message "Thinking budget exceeded - finalizing best-effort answer now." --spec-type draft-mtp --reasoning-preserve
    ctx_size: 131072
