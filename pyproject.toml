[project]
name = "model-serve"
version = "0.1.0"
description = "Multi-backend LLM serving stack (llama-swap, Ollama, MLX) behind one OpenAI-compatible API"
requires-python = ">=3.12"
dependencies = [
    # Model serving scripts
    "requests>=2.33.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    # Harmony proxy
    "openai-harmony>=0.0.8",
    "httpx>=0.27.0",
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.uv]
# Not a buildable package: uv installs only the dependencies into .venv/
package = false
# Security floors for transitive dependencies (minimum patched versions).
# Constraints only: they bound versions without making these direct dependencies.
constraint-dependencies = [
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
    "anyio>=4.14.2",
    "idna>=3.15",
    "certifi>=2026.10.18",
]

[tool.pytest.ini_options]
# The modules under test (harmony_proxy, generate_config, ...) live in the project root
pythonpath = ["."]
testpaths = ["tests"]
